name: CI/CD Pipeline

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  build_push_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/${{ secrets.REPOSITORY_NAME }}:latest .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/${{ secrets.REPOSITORY_NAME }}:latest

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.2.0

      - name: Terraform Init
        working-directory: ./tf
        run: terraform init -input=false

      - name: Terraform Plan
        working-directory: ./tf
        id: tfplan
        continue-on-error: true
        run: |
          terraform plan -input=false -detailed-exitcode -out=tfplan
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Terraform Apply
        working-directory: ./tf
        if: steps.tfplan.outputs.exit_code == '2'
        run: terraform apply -input=false -auto-approve tfplan
